<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windows-Style Splash Screen</title>
    <style>
      /* Reset default margins */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Fullscreen splash container */
      body,
      html {
        height: 100%;
        font-family: "Segoe UI", sans-serif;
        background-color: #0078d7; /* Windows blue */
        display: flex;
        justify-content: center;
        align-items: center;
      }

     

      
      /*  */
      /*  */
      /*  */
      /*  */
      /*  */
      /*  */
      /*  */
      /*  */
           /* VARIABLES REPLACED */
:root {
  --yellow: #00173a;
  --black: #292929;
  --bg: #191919;
  --lines: #757474;
}


/* TEXT BLOCK */
.text {
  opacity: 0;
  position: absolute;
  z-index: 7;
  text-align: left;
  margin: -50px 0 0 -150px;
  width: 300px;
  height: 100px;
  top: 50%;
  left: 50%;
  font-size: 48px;
  font-weight: 700;
  color: hsl(0, 0%, 100%);

  -webkit-animation: on .6s ease-in-out 3.7s forwards;
  -moz-animation: on .6s ease-in-out 3.7s forwards;
  -o-animation: on .6s ease-in-out 3.7s forwards;
  animation: on .6s ease-in-out 3.7s forwards;
}

.text p {
  white-space: nowrap;
  overflow: hidden;
  width: 100%;

  -webkit-animation: type .3s steps(60, end) 3.7s;
  -moz-animation: type .3s steps(60, end) 3.7s;
  -o-animation: type .3s steps(60, end) 3.7s;
  animation: type .3s steps(60, end) 3.7s;
}

.text p:nth-child(2) {

  -webkit-animation: type2 .5s steps(60, end) 3.7s;
  -moz-animation: type2 .5s steps(60, end) 3.7s;
  -o-animation: type2 .5s steps(60, end) 3.7s;
  animation: type2 .5s steps(60, end) 3.7s;
}

.text button {
  border: 0;
  opacity: 0;
  background: #191919;
  color: #00173a;
  border: 1px solid #191919;
  letter-spacing: 2px;
  padding: .5rem 2.5rem;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  cursor: pointer;

  -webkit-transition: color .5s, background-color .5s;
  -moz-transition: color .5s, background-color .5s;
  -ms-transition: color .5s, background-color .5s;
  -o-transition: color .5s, background-color .5s;
  transition: color .5s, background-color .5s;

  -webkit-animation: on .6s ease-in-out 4s forwards;
  -moz-animation: on .6s ease-in-out 4s forwards;
  -o-animation: on .6s ease-in-out 4s forwards;
  animation: on .6s ease-in-out 4s forwards;
}

.text button:hover {
  background: #00173a;
  color: #191919;
  border: 1px solid #191919;
}

/* SPLASH */
.splash {
  width: 100vw;
  height: 100vh;
  position: fixed;
  top: 0;
  display: flex;
  overflow: hidden;
}

/* SPLASH LOGO */
.splash_logo {
  position: absolute;
  margin: -20px 0 0 -50px;
  top: 50vh;
  z-index: 5;
  left: 50vw;
  width: 100px;
  text-align: center;
  height: 50px;
  font-size: 26px;
  /* border: 1px solid red; */
  font-weight: 600;
  color: #ffffff;
  opacity: 1;
  will-change: opacity;

  -webkit-animation: logo .3s ease-in 1.5s forwards, off .6s ease-in-out 3.2s forwards;
  -moz-animation: logo .3s ease-in 1.5s forwards, off .6s ease-in-out 3.2s forwards;
  -o-animation: logo .3s ease-in 1.5s forwards, off .6s ease-in-out 3.2s forwards;
  animation: logo .3s ease-in 1.5s forwards, off .6s ease-in-out 3.2s forwards;
}

.splash_logo:before {
  display: block;
  position: absolute;
  left: 0px;
  bottom: -5px;
  width: 100px;
  height: 1px;
  background-color: #757474;
  content: "";
}

.splash_logo:after {
  display: block;
  position: absolute;
  left: 0px;
  top: -25px;
  width: 100px;
  height: 1px;
  background-color: #757474;
  content: "";
  will-change: width;
}

/* SPLASH SVG */
.splash_svg {
  position: relative;
  margin: auto;
  width: 100%;
  height: 100%;
}

.splash_svg svg {
  width: 100%;
  height: 100%;
  backface-visibility: visible;
}

.splash_svg svg rect {
  width: 100%;
  height: 100%;
  fill: #fff;
  stroke: 0;
  clip-path: polygon(45vw 40vh, 55vw 40vh, 55vw 60vh, 45vw 60vh);

  -webkit-animation: expand .7s ease-in forwards 2.7s;
  -moz-animation: expand .7s ease-in forwards 2.7s;
  -o-animation: expand .7s ease-in forwards 2.7s;
  animation: expand .7s ease-in forwards 2.7s;
}

/* SPLASH MINIMIZE */
.splash_minimize {
  position: absolute;
  margin: auto;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  z-index: 4;
}

.splash_minimize svg {
  width: 100%;
  height: 100%;
  backface-visibility: visible;
}

.splash_minimize svg rect {
  width: 100%;
  height: 100%;
  clip-path: polygon(0vw 0vh, 100vw 0vh, 100vw 100vh, 0vw 100vh);

  -webkit-animation: scale .2s ease-out forwards 1s, hide 1.3s ease-out forwards 1.2s;
  -moz-animation: scale .2s ease-out forwards 1s, hide 1.3s ease-out forwards 1.2s;
  -o-animation: scale .2s ease-out forwards 1s, hide 1.3s ease-out forwards 1.2s;
  animation: scale .2s ease-out forwards 1s, hide 1.3s ease-out forwards 1.2s;
}

/* KEYFRAMES — ALL EXTRACTED */

@-webkit-keyframes scale {
  100% {
    clip-path: polygon(45vw 40vh, 55vw 40vh, 55vw 60vh, 45vw 60vh);
  }
}
@keyframes scale {
  100% {
    clip-path: polygon(45vw 40vh, 55vw 40vh, 55vw 60vh, 45vw 60vh);
  }
}

@-webkit-keyframes hide {
  100% {
    fill: transparent;
  }
}
@keyframes hide {
  100% {
    fill: transparent;
  }
}

@-webkit-keyframes off {
  100% {
    opacity: 0;
  }
}
@keyframes off {
  100% {
    opacity: 0;
  }
}

@-webkit-keyframes on {
  100% {
    opacity: 1;
  }
}
@keyframes on {
  100% {
    opacity: 1;
  }
}

@-webkit-keyframes logo {
  100% {
    color: #292929;
  }
}
@keyframes logo {
  100% {
    color: #292929;
  }
}

@-webkit-keyframes type {
  0% {
    width: 0;
  }
}
@keyframes type {
  0% {
    width: 0;
  }
}

@-webkit-keyframes type2 {
  0% {
    width: 0;
  }
  50% {
    width: 0;
  }
  100% {
    width: 100%;
  }
}
@keyframes type2 {
  0% {
    width: 0;
  }
  50% {
    width: 0;
  }
  100% {
    width: 100%;
  }
}

@-webkit-keyframes expand {
  0% {}
  25% {
    clip-path: polygon(0vw 0vh, 55vw 40vh, 55vw 60vh, 45vw 60vh);
    fill: white;
  }
  50% {
    clip-path: polygon(0vw 0vh, 100vw 0vh, 55vw 60vh, 45vw 60vh);
    fill: #00173a;
  }
  75% {
    clip-path: polygon(0vw 0vh, 100vw 0vh, 55vw 60vh, 0vw 100vh);
    fill: white;
  }
  100% {
    clip-path: polygon(0vw 0vh, 100vw 0vh, 100vw 100vh, 0vw 100vh);
    fill: #00173a;
  }
}

@keyframes expand {
  0% {}
  25% {
    clip-path: polygon(0vw 0vh, 55vw 40vh, 55vw 60vh, 45vw 60vh);
    fill: white;
  }
  50% {
    clip-path: polygon(0vw 0vh, 100vw 0vh, 55vw 60vh, 45vw 60vh);
    fill: #00173a;
  }
  75% {
    clip-path: polygon(0vw 0vh, 100vw 0vh, 55vw 60vh, 0vw 100vh);
    fill: white;
  }
  100% {
    clip-path: polygon(0vw 0vh, 100vw 0vh, 100vw 100vh, 0vw 100vh);
    fill: #00173a;
  }
}


    </style>
  </head>
  <body>
    <div class="splash">
  <div class="splash_logo">
    Linklist
  </div>
  <div class="splash_svg">
    <svg width="100%" height="100%">
      <rect width="100%" height="100%" >
    </svg>
  </div>
  <div class="splash_minimize">
    <svg width="100%" height="100%">
      <rect width="100%" height="100%" >
    </svg>
  </div>
</div>
<div class="text">
  <span style="font-size:30px; font-weight:600;  display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center;">
      Welcome to Linklist
    </span>
  <span style="font-size:15px; font-weight:400;  display: flex; align-items: center; justify-content: center; gap: 10px; margin-top:10px; text-align: center;" >
      Organize your links effortlessly.
    </span>
  <span style="font-size:12px; font-weight:400;  display: flex; align-items: center; justify-content: center; gap: 10px; margin-top:20px;">
    Version 1.0.0
  </span>
  <span class="copyright" style="font-size:12px; font-weight:400;  display: flex; align-items: center; justify-content: center; gap: 10px; margin-top:20px;">
      &copy; 2019 Linklist. All Rights Reserved.
  </span>
</div>
  </body>
</html>
